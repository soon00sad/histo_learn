server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4096m;  # WSI slides can be multi-gigabyte

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;  # WSI analysis can take up to ~15 minutes
    }

    location / {
        try_files $uri /index.html;
    }
}
